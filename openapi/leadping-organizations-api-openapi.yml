components:
  schemas:
    OrganizationTableRow:
      type: object
      properties:
        id:
          type: string
          description: Unique Leadping identifier for this organization.
        name:
          type: string
          description: The human-readable name shown for this organization.
        organization:
          type:
          - 'null'
          - object
          allOf:
          - $ref: '#/components/schemas/IdNamePair'
          description: Identifier and display name of the related organization.
        industry:
          type:
          - 'null'
          - string
          description: Industry for this organization.
        userCount:
          type: integer
          description: The user count for this organization.
          format: int32
        accountBalance:
          type:
          - 'null'
          - number
          description: Account balance for this organization.
          format: double
        billingPlan:
          enum:
          - Annual
          - Monthly
          type:
          - 'null'
          - string
          description: Identifies the Leadping subscription plan that determines organization features, allowances, and billing behavior.
        subscriptionStatus:
          enum:
          - Pending
          - Active
          - Overdue
          - Canceled
          type:
          - 'null'
          - string
          description: Describes an organization's billing subscription lifecycle, including trial, active, delinquent, canceled, and expired states.
        lastSubscriptionEventAt:
          type:
          - 'null'
          - string
          description: Date and time when this Leadping organization table row was last subscription event.
          format: date-time
        subscriptionCancelAt:
          type:
          - 'null'
          - string
          description: Date and time when this Leadping organization table row was subscription cancel.
          format: date-time
        paymentFailedAt:
          type:
          - 'null'
          - string
          description: Date and time when this Leadping organization table row was payment failed.
          format: date-time
        phone:
          type: string
          description: The phone number associated with this organization.
        website:
          type: string
          description: The website URL associated with this organization.
        status:
          enum:
          - SettingUp
          - SetupCompleted
          - Active
          type:
          - 'null'
          - string
          description: Describes an organization's account lifecycle and whether it can actively use Leadping services.
        enabled:
          type: boolean
          description: Whether this organization is enabled.
        apiKeyPreview:
          type:
          - 'null'
          - string
          description: The masked API key preview owned by this organization.
