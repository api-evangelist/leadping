          type:
          - 'null'
          - array
          items:
            type: string
          description: WorkOS permission slugs granted to this organization API key.
        apiKeyIssuedAt:
          type:
          - 'null'
          - string
          description: The date and time this organization API key was issued.
          format: date-time
        apiKeyFirstUsedAt:
          type:
          - 'null'
          - string
          description: The date and time this organization API key was first used.
          format: date-time
        apiKeyLastUsedAt:
          type:
          - 'null'
          - string
          description: The date and time this organization API key was last used.
          format: date-time
        apiKeyExpiresAt:
          type:
          - 'null'
          - string
          description: The date and time this organization API key expires, or null when it has no expiration.
          format: date-time
        apiKeyTotalUses:
          type: integer
          description: The total number of tracked uses for this organization API key.
          format: int64
        setupStep:
          enum:
          - DomainFinding
          - DomainOptionsFound
          - SiteGenerating
          - SiteGenerated
          - BrandSubmitted
          - BrandApproved
          - CampaignSubmitted
          - CampaignApproved
          - CarrierReviewing
          - TenDlcComplete
          - Complete
