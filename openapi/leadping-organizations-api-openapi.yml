          enum:
          - DraftOnboarding
          - PaymentMethodPending
          - PaymentMethodConfirmed
          - SubscriptionPending
          - SubscriptionReceived
          - SubscriptionActive
          - LaunchReviewPending
          - TelephonyProvisioningPending
          - TelephonyPartiallyProvisioned
          - TelephonyReady
