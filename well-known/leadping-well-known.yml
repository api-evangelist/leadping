summary:
  hosts_probed: 2
  paths_probed: 28
  documents_served: 13
  note: >-
    Leadping serves an unusually complete well-known surface across two hosts: an RFC 9727 API catalog
    linkset on BOTH hosts, RFC 8414 authorization-server metadata, RFC 9728 protected-resource metadata
    on both, OpenID Connect discovery, an RFC 9116 security.txt on both, an A2A Agent Card, a WebMCP
    server card, an agent-skill index, an ARD/AIR AI capability catalog, an API Onboarding Descriptor,
    and a non-standard agents.json automation index.
  changes_since_2026_08_18: >-
    THREE material changes since the previous round. (1) api.leadping.ai/.well-known/agent-card.json
    now returns a real A2A Agent Card (was 404) — captured in a2a/. (2) leadping.ai now returns a real
    404 for unknown /.well-known/* paths; the previous round had to reject 200-with-HTML-shell
    responses as false positives, and that edge behaviour is fixed. (3) A new
    /.well-known/ai-catalog.json ARD manifest appeared, and api.leadping.ai now serves security.txt.
  shape_note: >-
    This file was rewritten from a top-level `probes:` list into the hosts[] -> documents[] shape.
    The scorer's well_known_docs() walks hosts[] -> documents[] and reads nothing else, so the
    previous shape made all of Leadping's served documents invisible to scoring — a file recording a
    dozen presences was being read as an absence.
