certifications_note: >-
  Leadping names NO third-party certification or attestation. There is no SOC 2, ISO 27001, PCI DSS,
  HIPAA attestation, FedRAMP authorization, or audit report referenced anywhere in the Trust Center,
  and no certificate-request or NDA-gated evidence flow. The Trust Center describes controls in prose
  and is explicit about the shared-responsibility split; it does not claim an audited program.
controls_described:
  encryption_in_transit: HTTPS/TLS
  encryption_at_rest: managed storage protections
  access_control: authenticated and scoped by organization membership, role, and credential
  production_access: restricted to authorized people and service providers
  monitoring: security-relevant activity, service health, delivery/provider signals, abuse indicators
  tenant_separation: stated
  backups: stated
  incident_handling: stated
