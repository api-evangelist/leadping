summary: >-
  Derived from 219 component schemas and their id-reference fields. Organization is the tenant root:
  almost every resource carries organizationId. Lead is the domain root: conversations, events, calls,
  SMS, status history and tags all hang off leadId. There are no $ref-embedded sub-resources between
  top-level entities — Leadping links by id field, not by nesting, so a client resolves the graph with
  follow-up calls rather than expansion (no expand/include parameter exists; see
  conventions/leadping-conventions.yml).
id_style:
  format: opaque string
  prefixes_published: false
  note: >-
    No documented id prefix scheme on resources. Credentials are prefixed (sk_ organization API key,
    lp_src_ source key, whsec_ webhook signing secret) but resource ids are not.
