  note: >-
    Re-checked 2026-09-03 against the re-harvested contract: zero of 144 operations carry
    "deprecated: true", and no Sunset or Deprecation response header is declared anywhere (the only
    declared response headers in the whole contract are Retry-After and WWW-Authenticate). There is
    still no deprecation policy page.

    But the absence is no longer neutral. Between 2026-08-18 and 2026-09-03 the contract removed FIVE
    operations outright — Contact_Submit, Contact_SubmitWebsite, Leads_CreateIntakeFromQuery,
    Organizations_AcceptInvitation and Organizations_GetInvitationByToken — with no deprecation
    marking, no Sunset header, no changelog entry naming them and no policy stating a notice period.
    Leadping is now demonstrably removing published operations silently, so a consumer pinned to any
    of those five discovered the change by breakage. That is a real deprecation gap, not a young-API
    artefact.
