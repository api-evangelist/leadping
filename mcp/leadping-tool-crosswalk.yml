    The organization-tools MCP server covers leads, conversations, events, sources and organization
    context. Everything else in the 137-operation REST contract has no documented tool: the whole
    communications surface (Sms, Calls, CallEvents, SmsEvents, Telephony, PhoneNumbers,
    OutboundDelivery), compliance (Suppressions), workflow (Automations, LeadStatuses,
