- name: Leadping Webhook Events
  description: Outbound HTTPS webhook deliveries fired by Leadping automations, signed with the Standard
    Webhooks specification (HMAC-SHA256 over {webhook-id}.{webhook-timestamp}.{body}, whsec_ signing secret).
    Leadping publishes no AsyncAPI document and no event-type catalog; the verification contract is documented
    in prose only.
