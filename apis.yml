aid: leadping
name: Leadping
description: Leadping is a lead-management and responsible-outreach platform for teams that need to move
  a new inbound lead from source to first touch without stitching together separate tools. It captures
  leads from approved sources, routes and assigns them, runs follow-up automations, sends SMS and MMS,
  places and transfers calls, keeps conversation and event history together, enforces recipient suppression
  and opt-out handling, tracks A2P 10DLC carrier registration and phone-number warmup, requires TrustedForm
  consent evidence where a source needs it, and reports usage, billing and analytics. The 137-operation
  REST API is published as an OpenAPI 3.1.1 contract with six Kiota-generated first-party SDKs, two remote
  MCP servers, Standard Webhooks signing, and an unusually complete machine-readable discovery surface
  including APIs.json, an RFC 9727 API catalog, RFC 9728 protected-resource metadata, llms.txt and an
  agent-skill index.
image: https://leadping.ai/img/favicon/leadpinglogo1024x1024.png
url: https://leadping.apievangelist.com/apis.yml
