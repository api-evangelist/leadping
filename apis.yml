apis:
- name: Leadping MCP Servers
  description: Two remote Model Context Protocol servers. A public read-only documentation server at https://leadping.ai/docs/mcp
    answers anonymous tools/list with search, virtual-filesystem and feedback tools. An authenticated
    organization-tools server at https://api.leadping.ai/mcp exposes read and lead-management tools over
    stateless Streamable HTTP at MCP protocol revision 2026-07-28, using a Leadping user access token
    or an organization API key.
  humanURL: https://leadping.ai/docs/mcp-server
  baseURL: https://api.leadping.ai/mcp
  tags:
  - MCP
  - Agent-native
  - Lead management
